<body>

<!-- The Modal-->
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>viewing file: {{ request.args.get('id') }}</h3>
    <div style="justify-content: center; display: flex; gap: 10px;">
        <a href="{{ url_for('paste', id=request.args.get('id')) }}" target="_blank"><button>view</button></a>
        <form action="/delete" method="POST" style="display: inline;">
            <input type="hidden" name="toDelete" value="{{ request.args.get('id') }}">
            <button class="danger" type="submit">delete</button>
        </form>
    </div>
    <form action="/rename" method="POST">
        <input type="hidden" name="oldKey" value="{{ request.args.get('id') }}">
        <input placeholder="new name..." minlength="3" maxlength="16" pattern="[a-zA-Z0-9]{5,16}" name="newKey">
        <button>rename</button>
    </form>
    

  </div>

</div>
<style>
    
    .inline {
        display: flex;
        gap: 10px; /* Adjust space between buttons */
        align-items: center; /* Center them vertically */
    
    }
    
    .danger {
        
        color: whitesmoke;
    }
    
    .danger:hover {
        border-color: red;
        color: red;
    }
      
    .modal {
           display: none; /* Hidden by default */

      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */ 
    }

      width: 80%; /* Could be more or less, depending on screen size */
    
    }
    
      .close {

    }
    
      .close:hover,

    h3 {
        font-size: 20px;

    }
