<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="altStyle">
    <div>
        <h3>admin panel</h3>
        <div>
            <form action="/delete" method="POST">
                <input type="text" name="toDelete" placeholder="file name..."></input>
                <button type="submit">delete</button>
            </form>
        </div>
        <div id="files" style="margin: auto;">
            <table>
                <thead>
                    <tr>
                        <th>name</th>
                        <th>size</th>
                        <th>manage</th>
                        <th>delete</th>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td>
                            <a href="{{ url_for('paste', id=file['Key']) }}" target="_blank">{{ file['Key'] }}</a>
                        </td>
                        <td>{{ file['Size'] }}B</td>
                        <td><a href="{{ url_for('manage', id=file['Key']) }}"><button>manage</button></a></td>
                        <td><form action="/delete" method="POST" style="margin: 0px;"><input type="hidden" value="{{ file['Key'] }}" name="toDelete"><button type="submit">delete</button></form></td>

                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
        </div>
        <div class="button-container">
            <form action="/logout" style="margin: 0px; margin-top: 7px;">
                <button class="danger">log out</button>
            </form>
            <button><a href="/" style="text-decoration: none;">home</a></button>
        </div>
    </div>

    <div id="actionsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

</body>
