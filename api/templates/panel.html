<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="altStyle" style="margin-top: 150px;">
    <div>
        <h3>admin panel</h3>
        <div>
            <form action="/delete" method="POST">
                <input type="text" name="toDelete" placeholder="file name..."></input>
                <button type="submit">delete</button>
            </form>
        </div>
        <div id="files">
            <table>
                <thead>
                    <tr>
                        <th>name</th>
                        <th>size</th>
                        <th>manage</th>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td>
                            <a href="{{ url_for('paste', id=file['Key']) }}" target="_blank">{{ file['Key'] }}</a>
                        </td>
                        <td>{{ file['Size'] }}B</td>
                        <td><a href="{{ url_for('manage', id=file['Key']) }}"><button>manage</button></a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
        </div>
        <form action="/logout" style="margin-top: 7px;">
            <button class="danger">log out</button>
        </form>

    </div>

    <div id="actionsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>
    <script>
        $(document).on('click', '.openModal', function() {
            const fileKey = $(this).data('key');
            $.get(`/modal?id=${fileKey}`, function(data) {
                $('#modalContent').html(data);
                $('#actionsModal').css('display', 'block');
            });
        });

        $('.close').on('click', function() {
            $('#actionsModal').css('display', 'none');
        });

        $(window).on('click', function(event) {
            if (event.target.id === 'actionsModal') {
                $('#actionsModal').css('display', 'none');
            }
        });
    </script>

</body>
