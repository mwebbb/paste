<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="altStyle">
    <div>
        <h3>admin panel</h3>
        <div>
            <form action="/delete" method="POST">
                <input type="text" name="toDelete" placeholder="file name..."></input>
                <button type="submit">delete</button>
            </form>
        </div>
        <div id="files">
            <table>
                <thead>
                    <tr>
                        <th>name</th>
                        <th>size</th>
                        <th>manage</th>
                        <th>delete</th>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td>
                            <div>
                                <a href="{{ url_for('manage', id=file['Key']) }}">
                                    <button type="button">manage</button>
                                </a>
                                <form action="/delete" method="POST">
                                    <input type="hidden" value="{{ file['Key'] }}" name="toDelete">
                                    <button type="submit">delete</button>
                                </form>
                            </div>
                        </td>
                        
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
        </div>
        <form action="/logout" style="margin-top: 7px;">
            <button class="danger">log out</button>
        </form>

    </div>

    <div id="actionsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

</body>
