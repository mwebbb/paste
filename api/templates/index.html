{% extends "base.html" %}
{% block page %}index{% endblock %}
{% block body %}
    <div class="shell">
        <header class="bar">
            <div class="brand">
                <a class="name" href="/">deltabin</a>
                <span class="tag">e2e</span>
            </div>
            <nav class="actions">
                <a class="btn ghost" href="/tos" target="_blank" rel="noopener">tos</a>
                <a class="btn ghost" href="/auth">auth</a>
            </nav>
        </header>

        <form class="paste-form" id="pasteForm">
            <textarea placeholder="paste something..." id="text" name="text" required autofocus spellcheck="false"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>

            <div class="bar bottom">
                <span class="muted" id="status"></span>
                <button id="createButton" class="primary" type="submit">save</button>
            </div>
        </form>
    </div>
{% endblock %}
