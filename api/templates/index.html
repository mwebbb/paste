<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deltabin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="header">
        <h3 class="title">deltabin</h3>
        <div class="button-container" style="margin-right: 2%">
            <a href="/tos" target="_blank"><button>tos</button></a>
            <a href="/auth"><button>auth</button></a>
        </div>
    </div>
    <form>
        <textarea placeholder="enter paste here..." type="text" id="text" name="text" required spellcheck="false"
            data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
        <h3><button id="createButton" class="submit" type="submit"><strong>submit</strong></button></h3>

    </form>
</body>

<style>
    body {
        background-color: black;
        color: white;
        font-family: mono, monospace;
        padding-left: 1%;
        text-align: left;
        font-size: 20px;
    }

    .submit,
    strong {
        font-size: 15px;
    }


    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .button-container {
        display: flex;
        gap: 10px;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
</style>

<script>

    var inputField = document.getElementById('text');

    inputField.onkeydown = function (e) {

        if (e.keyCode === 9) {

            this.setRangeText(

                '    ',

                this.selectionStart,

                this.selectionStart,

                'end'

            )

            return false;
        }

    };



    function b64(buf) {
        let s = "";
        for (const byte of new Uint8Array(buf)) s += String.fromCharCode(byte);
        return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    async function encryptPaste(text) {
        const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
        return { ct: b64(ct), iv: b64(iv), key: b64(await crypto.subtle.exportKey("raw", key)) };
    }

    document.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = document.getElementById("text").value;
        const { ct, iv, key } = await encryptPaste(text);
        const res = await fetch("/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ct, iv })
        });
        const { id } = await res.json();
        window.location.href = "/" + id + "#" + key;
    });


</script>
