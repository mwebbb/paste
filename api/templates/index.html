<!doctype html>
<html lang="en">
<head>
    {% include "_head.html" %}
    <title>deltabin</title>
</head>

<body>
    <div class="shell">
        <header class="bar">
            <div class="brand">
                <a class="name" href="/">deltabin</a>
                <span class="tag">e2e</span>
            </div>
            <nav class="actions">
                <a class="btn ghost" href="/tos" target="_blank" rel="noopener">tos</a>
                <a class="btn ghost" href="/auth">auth</a>
            </nav>
        </header>

        <form class="paste-form" id="pasteForm">
            <textarea placeholder="paste something..." id="text" name="text" required autofocus spellcheck="false"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>

            <div class="bar bottom">
                <span class="muted" id="status"></span>
                <div class="actions">
                    <button id="createButton" class="primary" type="submit"><span id="saveLabel">save</span><kbd class="keyhint hide-sm" id="saveKey">ctrl ↵</kbd></button>
                </div>
            </div>
        </form>
    </div>

    <script>
    const text = document.getElementById("text");
    const form = document.getElementById("pasteForm");
    const btn = document.getElementById("createButton");
    const label = document.getElementById("saveLabel");
    if (/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById("saveKey").textContent = "⌘↵";
    const status = document.getElementById("status");

    text.addEventListener("keydown", (e) => {
        if (e.key === "Tab") {
            e.preventDefault();
            text.setRangeText("    ", text.selectionStart, text.selectionEnd, "end");
        } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            form.requestSubmit();
        }
    });

    text.addEventListener("input", () => {
        const n = text.value.length;
        const bytes = new TextEncoder().encode(text.value).length;
        // base64 + json overhead: ~4/3 of the plaintext must fit in 256 kb
        const over = bytes * 4 / 3 + 200 > 256 * 1024;
        status.textContent = !n ? ""
            : over ? "too large" : n + " chars";
        btn.disabled = over;
    });

    function b64(buf) {
        let s = "";
        for (const byte of new Uint8Array(buf)) s += String.fromCharCode(byte);
        return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    async function encryptPaste(text) {
        const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
        return { ct: b64(ct), iv: b64(iv), key: b64(await crypto.subtle.exportKey("raw", key)) };
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!text.value) return;
        btn.disabled = true;
        label.textContent = "saving...";
        try {
            const { ct, iv, key } = await encryptPaste(text.value);
            const res = await fetch("/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ct, iv })
            });
            if (!res.ok) throw new Error(res.status === 413 ? "too large" : "upload failed");
            const { id } = await res.json();
            try { sessionStorage.setItem("fresh", id); } catch {}
            window.location.href = "/" + id + "#" + key;
        } catch (err) {
            status.textContent = "error: " + err.message;
            btn.disabled = false;
            label.textContent = "save";
        }
    });
    </script>
</body>
</html>
