{% extends "base.html" %}
{% block page %}index{% endblock %}
{% block body %}
    <div class="shell">
        <header class="bar">
            <div class="brand">
                <a class="name" href="/">∆bin</a>
                <span class="secure hide-sm"><svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 7V5a4 4 0 1 1 8 0v2h.5A1.5 1.5 0 0 1 14 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-5A1.5 1.5 0 0 1 3.5 7H4Zm2 0h4V5a2 2 0 1 0-4 0v2Z"/></svg>End-to-end encrypted</span>
            </div>
            <nav class="actions">
                <a class="btn ghost" href="/tos" target="_blank" rel="noopener">Terms</a>
                <a class="btn ghost" href="/auth">Admin</a>
            </nav>
        </header>

        <form class="paste-form" id="pasteForm">
            <textarea placeholder="Paste something…" id="text" name="text" required autofocus spellcheck="false"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>

            <div class="bar bottom">
                <span class="muted" id="status"></span>
                <button id="createButton" class="primary" type="submit">Save</button>
            </div>
        </form>
    </div>
{% endblock %}
