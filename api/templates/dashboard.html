<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<div>

    <h3>file list</h3>
    <div>
        <form action="/delete" method="POST">
            <input type="text" name="toDelete" placeholder="file name..."></input>
            <button type="submit"></button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>File Name</th>
                <th>Size (Bytes)</th>
            </tr>
        </thead>
        <tbody>
            {% for file in files %}
            <tr>
                <td><a href="{{ url_for('paste', id=file['Key']) }}">{{ file['Key'] }}</a></td>
                <td>{{ file['Size'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
