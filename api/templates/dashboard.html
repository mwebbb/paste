<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="altStyle">
    <div>
        <h3>file list</h3>
        <div>
            <form action="/delete" method="POST">
                <input type="text" name="toDelete" placeholder="file name..."></input>
                <button type="submit">delete</button>
            </form>
        </div>
        <div id="files">
            <table>
                <thead>
                    <tr>
                        <th>file name</th>
                        <th>size (bytes)</th>
                        <th>delete</th>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td><a href="{{ url_for('paste', id=file['Key']) }}" target="_blank">{{ file['Key'] }}</a>></td>
                        <td>{{ file['Size'] }}</td>
                        <td>
                            <form class="delete-form" data-file="{{ file['Key'] }}">
                                <button type="submit">delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
