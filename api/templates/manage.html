{% extends "base.html" %}
{% block title %} / {{ id }}{% endblock %}
{% block page %}manage{% endblock %}
{% block body %}
    <main class="center">
        <div class="card">
            <div class="card-head">
                <div class="brand">
                    <a class="name" href="/panel">panel</a>
                    <span class="crumb">{{ id }}</span>
                </div>
                <a class="btn ghost" href="/panel">back</a>
            </div>

            <dl class="meta">
                <dt>size</dt><dd>{{ size|size }}</dd>
                <dt>created</dt><dd>{{ modified.strftime('%Y-%m-%d %H:%M UTC') }}</dd>
            </dl>

            <div class="card-body">
                {% if error %}<div class="error">{{ error }}</div>{% endif %}
                <label class="label" for="new">rename</label>
                <form class="row" action="/rename" method="post">
                    <input type="hidden" name="old" value="{{ id }}">
                    <input id="new" name="new" placeholder="new name" maxlength="16" pattern="[a-zA-Z0-9_\-]{1,16}" autocomplete="off" spellcheck="false">
                    <button type="submit">rename</button>
                </form>
            </div>

            <form class="card-foot" action="/delete" method="post" data-confirm="permanently delete this paste?">
                <input type="hidden" name="name" value="{{ id }}">
                <button class="danger" type="submit">delete</button>
            </form>
        </div>
    </main>
{% endblock %}
