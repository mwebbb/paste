{% extends "base.html" %}
{% block title %} / {{ id }}{% endblock %}
{% block page %}view{% endblock %}
{% block body %}
    <div class="shell">
        <header class="bar">
            <div class="brand">
                <a class="name" href="/">deltabin</a>
                <span class="crumb">{{ id }}</span>
                <span class="tag">e2e</span>
            </div>
            <nav class="actions">
                <button id="linkButton" class="ghost hide-sm" type="button">copy link</button>
                <button id="downloadButton" class="ghost hide-sm" type="button" disabled>download</button>
                <button id="copyButton" type="button" disabled>copy</button>
                <a class="btn" href="/">new</a>
            </nav>
        </header>

        <div id="notice" class="notice" hidden>
            <span>saved</span>
            <button id="noticeCopy" class="primary" type="button">copy link</button>
        </div>

        <textarea id="text" readonly spellcheck="false" autocomplete="off" placeholder="decrypting..."
            data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>

        <footer class="bar bottom">
            <span class="muted" id="status"></span>
        </footer>
    </div>

    <script type="application/json" id="payload">{{ {"id": id, "ct": payload.ct, "iv": payload.iv}|tojson }}</script>
{% endblock %}
