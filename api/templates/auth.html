{% extends "base.html" %}
{% block title %} / auth{% endblock %}
{% block page %}auth{% endblock %}
{% block body %}
    <main class="center">
        <div class="card">
            <div class="card-head">
                <h1>auth</h1>
                <a class="btn ghost" href="/">back</a>
            </div>
            <form class="card-body" method="post" action="/auth">
                {% if error %}<div class="error">{{ error|lower }}</div>{% endif %}
                <label class="label" for="key">access key</label>
                <div class="row">
                    <input name="key" type="password" id="key" autocomplete="current-password" autofocus required>
                    <button class="primary" type="submit">enter</button>
                </div>
            </form>
        </div>
    </main>
{% endblock %}
